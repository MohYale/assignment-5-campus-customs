<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resolved board</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
      color: #1c1915;
      background: #f7f3ea;
      line-height: 1.5;
    }
    header, main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 28px 0 8px; }
    h1 { font-size: 1.7rem; margin: 0 0 8px; }
    header p, figcaption { color: #5c564c; }
    figure { margin: 0 0 36px; }
    img {
      width: 100%;
      height: auto;
      border: 1px solid #d9d1c3;
      background: #fff;
    }
    h2 { font-size: 1.25rem; margin: 0 0 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Resolved board</h1>
    <p>Each picture is the React desk after that ticket’s run. All three were already resolved when the pictures were taken, and the three approvals had been posted, so checking shows the ending balance of $728.00 on every shot. The selected ticket is the run in the thought chain.</p>
  </header>
  <main>
    <figure>
      <h2>Ticket 101</h2>
      <img src="board-101.png" alt="React desk with ticket 101 selected, resolved, and its thought chain visible. Checking is $728.00.">
      <figcaption>Ticket 101 resolved. Splinter, Leonardo, and Donatello. The owner had approved the $8 tee.</figcaption>
    </figure>
    <figure>
      <h2>Ticket 102</h2>
      <img src="board-102.png" alt="React desk with ticket 102 selected, resolved, and its rent thought chain visible. Checking is $728.00.">
      <figcaption>Ticket 102 resolved. The rent draft for $2,400 is the approval on the right.</figcaption>
    </figure>
    <figure>
      <h2>Ticket 103</h2>
      <img src="board-103.png" alt="React desk with ticket 103 selected, resolved, and its hoodie thought chain visible. Checking is $728.00.">
      <figcaption>Ticket 103 resolved. The $264 hoodie purchase and the unsent customer draft are on the board.</figcaption>
    </figure>
  </main>
</body>
</html>
